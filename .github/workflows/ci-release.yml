name: Vedro Multi-Platform Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust & Flutter Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native media libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libplacebo-dev libsqlite3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/verify-all.sh

  build-android:
    name: Android APKs (arm64 + armv7 + x86_64 + universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo install cargo-ndk --locked
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_FILE="${RUNNER_TEMP}/vedro-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          fi
      - name: Build Android release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: bash scripts/build-android.sh
      - name: Verify Android APK signing certificate and versionCode
        env:
          REQUIRE_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          AAPT2="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
          for apk in dist/vedro-v*-android-*.apk; do
            echo "==> Verifying $apk"
            if [ -n "$AAPT2" ]; then
              "$AAPT2" dump badging "$apk" | head -n 1
            fi
            if [ -n "$APKSIGNER" ]; then
              CERT_OUT="$("$APKSIGNER" verify --print-certs "$apk")"
            else
              CERT_OUT="$(keytool -printcert -jarfile "$apk")"
            fi
            echo "$CERT_OUT"
            if [ "$REQUIRE_RELEASE_SIGNING" = "true" ] && echo "$CERT_OUT" | grep -qi "Android Debug"; then
              echo "ERROR: $apk was signed with ephemeral debug key!" >&2
              exit 1
            fi
          done
      - name: Clean up Android release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/vedro-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-android-apks
          path: dist/vedro-v*-android-*.apk

  build-windows:
    name: Windows x64 (DXGI HDR + WASAPI Atmos)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: pwsh scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-windows-x64
          path: dist/vedro-v*-windows-x64-setup.exe

  build-macos:
    name: macOS Universal DMG (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-macos-universal
          path: dist/vedro-v*-macos-universal.dmg

  build-ios:
    name: iOS Unsigned IPA (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-ios-unsigned
          path: dist/vedro-v*-ios-unsigned.ipa
