name: Vedro Multi-Platform Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Rust & Flutter Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native media libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libplacebo-dev libsqlite3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/verify-all.sh

  build-android:
    name: Android APKs (arm64 + armv7 + x86_64 + universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo install cargo-ndk --locked
      - run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-android-apks
          path: dist/vedro-android-*.apk

  build-windows:
    name: Windows x64 (DXGI HDR + WASAPI Atmos)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: pwsh scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-windows-x64
          path: dist/vedro-windows-x64.zip

  build-macos:
    name: macOS Universal DMG (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-macos-universal
          path: dist/vedro-macos-universal.dmg

  build-ios:
    name: iOS Unsigned IPA (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vedro-ios-unsigned
          path: dist/vedro-ios-unsigned.ipa
