name: Prism Player CI & Multi-Platform Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust-core-verify:
    name: Rust Core (Test + Clippy + Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native media libs (libmpv + libplacebo + sqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libplacebo-dev libsqlite3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --nocapture
      - run: cargo build --release -p prism-ffi -p prism-cli

  flutter-verify:
    name: Flutter UI + Live Rust FFI Tests
    runs-on: ubuntu-latest
    needs: rust-core-verify
    steps:
      - uses: actions/checkout@v4
      - name: Install native media libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libplacebo-dev libsqlite3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cargo build --release -p prism-ffi
      - name: Analyze & Test Flutter App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-android:
    name: Build Android (ARM64 + ARMv7 + x86_64)
    runs-on: ubuntu-latest
    needs: [rust-core-verify, flutter-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo install cargo-ndk
      - run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prism-player-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-14
    needs: [rust-core-verify, flutter-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prism-player-macos
          path: app/build/macos/Build/Products/Release/prism_player.app

  build-ios:
    name: Build iOS (XCFramework + Unsigned IPA)
    runs-on: macos-14
    needs: [rust-core-verify, flutter-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-ios.sh

  build-windows:
    name: Build Windows (x64 + DXGI HDR + WASAPI Atmos)
    runs-on: windows-latest
    needs: [rust-core-verify, flutter-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: pwsh scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: prism-player-windows-x64
          path: app/build/windows/x64/runner/Release/
