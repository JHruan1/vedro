[workspace]
resolver = "2"
members = [
    "core/vedro-protocol",
    "core/vedro-stream",
    "core/vedro-playback",
    "core/vedro-storage",
    "core/vedro-ffi",
    "core/vedro-cli",
]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "system-proxy", "socks", "gzip", "brotli", "deflate", "http2"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.7"
parking_lot = "0.12"
dashmap = "6.1"
lru = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
hyper = { version = "1.4", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
http = "1.1"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
