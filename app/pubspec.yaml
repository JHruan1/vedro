name: vedro
description: "Vedro — High-performance Rust + libmpv/libplacebo cross-platform player for embygo, Emby, and Jellyfin with Dolby Vision and Dolby Atmos."
publish_to: 'none'
version: 0.2.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
